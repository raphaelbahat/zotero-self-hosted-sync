name: Release

# A push to dev is merged into main and released from there, in one run. There is no pull request
# and nothing waits on a human, by design.
#
# Two things about that are worth knowing before changing this file:
#
#   - Every push to dev becomes a stable release. dev is merged to main immediately, so the branches
#     stay in step and a prerelease stage would have nothing to sit between.
#   - The `branches: [dev]` trigger is what stops this from looping. Pushes made with the repository
#     token — the release commit on main, and the backmerge that carries it into dev — do not start
#     workflows of their own, so the merge runs once per human push and not once per release.
#
# main is deliberately not protected. A protected main would reject the merge in the first job, and
# the release with it.

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  merge:
    name: Merge dev into main
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # --no-ff and never a squash: the release tooling reads the commits dev brings with it, and
      # squashing them into one would hide the fix:/feat: types that decide the next version.
      - name: Merge dev into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          if ! git merge --no-ff --no-edit origin/dev; then
            git merge --abort
            echo "::error::dev does not merge cleanly into main. Nothing was pushed; both branches are as they were."
            exit 1
          fi
          git push origin main

  release:
    name: Release
    needs: merge
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # main, because that is the branch the merge above just moved and the one semantic-release
      # reads a stable version from.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # semantic-release reads every branch .releaserc configures — it asks `git tag --merged
      # <branch>` about each to decide which one is releasing — so dev has to resolve in this
      # clone even though the release is cut from main. Without this the run dies on
      # "fatal: malformed object name dev" after the merge has already been pushed.
      - name: Fetch the other release branches
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Semantic release runs its own Gradle build command, and pushes the release commit itself.
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        with:
          # Only main releases. Without this the action evaluates every branch .releaserc lists —
          # dev among them, as a prerelease — and a run from main came out as a dev pre-release the
          # first time this workflow ran. Overriding here also leaves the pre-release branch in
          # .releaserc idle rather than removed: nothing reads it while this line stands.
          branches: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        # Build attestations are only available for public repositories (and for organisation-owned
        # ones). On a private repository this step fails a run whose release is already published,
        # so it is skipped there and starts working by itself the day the repository is public.
        if: steps.release.outputs.new_release_published == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Compile when semantic-release published nothing — a docs or chore commit, which still
      # arrives here because every dev push is merged — so a broken source tree is never merged
      # silently.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
