name: Release

# A push to dev is merged into main, and the release is cut from main. No pull request, and nothing
# waits on a human.
#
# It takes two runs, and the reason is worth keeping. semantic-release decides which branch it is on
# from the *event* — the ref the workflow was triggered by — not from the branch a job checked out.
# A push to dev therefore looks like dev to it whatever is checked out, which is how the first
# attempt at this published a dev pre-release from main, and why simply constraining the action to
# main then blocked every release instead.
#
# So the push run merges, and then dispatches this same workflow on main. The dispatched run's event
# ref *is* main, so semantic-release releases a stable version there. A dispatch is also the one way
# to start a workflow that a push made with the repository token cannot do for itself.
#
# The dev-only trigger, and the `if:` on each job, are what keep this from looping: the release
# commit and the backmerge are pushed with the repository token, and those pushes start nothing.
#
# main is deliberately unprotected. A protected main would reject the merge, and this with it.

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  merge:
    name: Merge dev into main
    # Only when a human pushed. The dispatched run must not merge, or dispatch again.
    if: github.event_name == 'push'
    permissions:
      contents: write
      actions: write # to dispatch the release below
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # --no-ff and never a squash: the release tooling reads the commits dev brings with it, and
      # squashing them into one would hide the fix:/feat: types that decide the next version.
      - name: Merge dev into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          if ! git merge --no-ff --no-edit origin/dev; then
            git merge --abort
            echo "::error::dev does not merge cleanly into main. Nothing was pushed; both branches are as they were."
            exit 1
          fi
          git push origin main

      - name: Release from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main

  release:
    name: Release
    # Only the dispatched run releases: only it has main as its event ref.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # semantic-release asks every branch .releaserc configures which tags are merged into it, so
      # dev has to resolve in this clone even though the release is cut from main.
      - name: Fetch the other release branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Semantic release runs its own Gradle build command, and pushes the release commit itself.
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        with:
          branches: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        # Build attestations are only available for public repositories (and for organisation-owned
        # ones). On a private repository this step fails a run whose release is already published,
        # so it is skipped there and starts working by itself the day the repository is public.
        if: steps.release.outputs.new_release_published == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Compile when semantic-release published nothing, so a broken source tree is never merged
      # silently.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon